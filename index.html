<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Muaz Islam Babar — Full-Stack Developer</title>
    <meta
      name="description"
      content="Muaz Islam Babar is a Computer Science undergraduate and full-stack developer in Multan, Pakistan, building React interfaces, Linux-based systems and small products that solve real problems."
    />
    <meta name="author" content="Muaz Islam Babar" />
    <meta name="theme-color" content="#F2ECE0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131110" media="(prefers-color-scheme: dark)" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Gelasio:ital,wght@0,400..700;1,400..700&family=IBM+Plex+Mono:wght@300;400;500&family=Manrope:ital,wght@0,200..800;1,400..800&display=swap"
      rel="stylesheet"
    />

    <script>
      (function () {
        try {
          var stored = window.localStorage.getItem('theme');
          var theme =
            stored === 'dark' || stored === 'light'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch (error) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
